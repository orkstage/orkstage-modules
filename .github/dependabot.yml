version: 2
updates:
  # Provider constraints in every module (modules/<cloud>/<kind>/versions.tf).
  - package-ecosystem: terraform
    directories:
      - /modules/*/*
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ['*']
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # OpenTofu and Alpine base images of the runner image.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
