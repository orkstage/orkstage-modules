# Labels added from the changed paths (actions/labeler, run by the community workflow).
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']
provider:
  - changed-files:
      - any-glob-to-any-file: ['modules/**']
