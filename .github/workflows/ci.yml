name: CI

on:
  # Public repository: Actions minutes are free, so every push to main and every pull request is
  # built, plus a weekly run that keeps caches warm.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels its previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TOFU_VERSION: 1.12.9

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner --verbose
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive -diff modules

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Cache provider plugins
        uses: actions/cache@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: tofu-plugins-${{ hashFiles('modules/**/versions.tf') }}
      # Every module must initialize and validate on its own (no backend, no credentials).
      - name: Validate each module
        env:
          TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for dir in modules/*/*/; do
            echo "::group::$dir"
            if tofu -chdir="$dir" init -backend=false -input=false -no-color \
              && tofu -chdir="$dir" validate -no-color; then
              echo "ok: $dir"
            else
              echo "::error::validation failed in $dir"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  runner-image:
    # The runner image bakes the modules in at /modules; make sure it still builds.
    # `scripts/polyrepo/split.sh` adds `docker/tofu-runner.Dockerfile` to this repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/tofu-runner.Dockerfile -t orkstage/tofu-runner:ci .
      - run: docker run --rm orkstage/tofu-runner:ci version
